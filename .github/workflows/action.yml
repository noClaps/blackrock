name: Test action

on:
  push:
    paths: [action.yml, .github/workflows/action.yml]
  workflow_dispatch:

jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [latest, v0.1.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          version: ${{ matrix.version }}
      - run: blackrock --version
