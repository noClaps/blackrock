[package]
name = "blackrock"
version = "0.2.0"
edition = "2024"

[dependencies]
giallo = { version = "0.5", features = ["dump"] }
math-core = "0.9"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13"
pulldown-cmark-escape = "0.11"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
