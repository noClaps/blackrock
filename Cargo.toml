[package]
name = "blackrock"
version = "0.1.3"
edition = "2024"

[dependencies]
giallo = { version = "0.5", features = ["dump"] }
math-core = "0.9"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13"
pulldown-cmark-escape = "0.11"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

# Optimize release builds for size rather than speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
